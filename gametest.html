<!DOCTYPE html><html><body style="margin:0;background:#000"><div id="g" style="position:fixed;inset:0"></div>
<script type="module">
import { createGame } from '/src/game/Game.ts'
import { createHudStore } from '/src/game/bus.ts'
const hud = createHudStore()
const touch = { x: 0, y: 0, fire: true }
